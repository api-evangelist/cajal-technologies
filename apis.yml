aid: cajal-technologies
name: Cajal Technologies
description: >-
  Cajal Technologies (Cajal) is a San Francisco-based Y Combinator (W26) company scaling
  formal verification to accelerate scientific discovery. Its multi-agent system, Tau,
  collaborates to discover and verify new mathematical proofs in Lean, deploying AI
  mathematicians across high-impact applied domains starting with quantum computing and
  finance. Tau verifies compiled binaries with mathematical certainty down to the machine
  level. Cajal also partners with frontier AI labs and research institutes to improve their
  systems through datasets, evals, and RL environments, and open-sources tooling such as
  Talos, a Wasm interpreter written in Lean designed for reasoning.
